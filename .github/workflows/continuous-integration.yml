name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: continuous-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Continuous integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0

      - name: Enable pinned Yarn
        run: corepack enable

      - name: Create evidence directory
        run: mkdir -p continuous-integration-evidence

      - name: Verify immutable installation
        run: yarn install --immutable 2>&1 | tee continuous-integration-evidence/install.log

      - name: Verify formatting
        run: yarn format:check 2>&1 | tee continuous-integration-evidence/format.log

      - name: Lint repository
        run: yarn lint 2>&1 | tee continuous-integration-evidence/lint.log

      - name: Verify repository policy
        run: yarn policy:check 2>&1 | tee continuous-integration-evidence/policy.log

      - name: Verify generated state
        run: yarn generate:check 2>&1 | tee continuous-integration-evidence/generation.log

      - name: Type-check repository
        run: yarn typecheck 2>&1 | tee continuous-integration-evidence/typecheck.log

      - name: Audit dependencies
        run: yarn security:audit 2>&1 | tee continuous-integration-evidence/security-audit.log

      - name: Run tests with coverage
        id: unit_tests
        run: yarn test:ci 2>&1 | tee continuous-integration-evidence/test.log

      - name: Retain unit test evidence for 14 days
        if: ${{ always() && steps.unit_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            continuous-integration-evidence/test.log
            test-results/junit.xml
            coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Build production website
        run: yarn build 2>&1 | tee continuous-integration-evidence/build.log

      - name: Verify bundle budgets
        run: yarn bundle:check 2>&1 | tee continuous-integration-evidence/bundle.log

      - name: Build Storybook
        run: yarn build-storybook 2>&1 | tee continuous-integration-evidence/storybook.log

      - name: Prove gates fail closed
        run: yarn test:ci-fail-closed 2>&1 | tee continuous-integration-evidence/fail-closed.log

      - name: Retain continuous integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: continuous-integration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            continuous-integration-evidence/
            test-results/
            coverage/
            dist/
            storybook-static/
          if-no-files-found: error
          retention-days: 14
