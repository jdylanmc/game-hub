name: Configure Game Hub External ID

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        description: Protected Azure environment
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: game-hub-external-id-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  configure:
    name: Configure ${{ inputs.environment }} External ID
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      AZURE_SUBSCRIPTION_ID: '11213dbd-39fe-46ba-87db-5f5e8c449aed'
      GAME_HUB_ENVIRONMENT: ${{ inputs.environment }}
      GAME_HUB_EXTERNAL_ID_APP_ID: ${{ vars.EXTERNAL_ID_APP_ID }}
      GAME_HUB_EXTERNAL_ID_TENANT_ID: ${{ vars.EXTERNAL_ID_TENANT_ID }}
      GAME_HUB_FACEBOOK_CLIENT_ID: ${{ vars.EXTERNAL_ID_FACEBOOK_CLIENT_ID }}
      GAME_HUB_GOOGLE_CLIENT_ID: ${{ vars.EXTERNAL_ID_GOOGLE_CLIENT_ID }}

    steps:
      - name: Check out protected main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0

      - name: Verify protected ref and non-secret environment configuration
        env:
          AZURE_SECRET_CLIENT_ID: ${{ vars.AZURE_SECRET_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          EXTERNAL_ID_CONFIG_CLIENT_ID: ${{ vars.EXTERNAL_ID_CONFIG_CLIENT_ID }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "$AZURE_SECRET_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$EXTERNAL_ID_CONFIG_CLIENT_ID"
          test -n "$GAME_HUB_EXTERNAL_ID_APP_ID"
          test -n "$GAME_HUB_EXTERNAL_ID_TENANT_ID"
          test -n "$GAME_HUB_FACEBOOK_CLIENT_ID"
          test -n "$GAME_HUB_GOOGLE_CLIENT_ID"

      - name: Enable pinned Yarn
        run: corepack enable

      - name: Verify the reviewed account and federation configuration
        run: |
          yarn install --immutable
          yarn auth:check

      - name: Sign in to the provider credential vault with OpenID Connect
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_SECRET_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: 11213dbd-39fe-46ba-87db-5f5e8c449aed

      - name: Configure accounts and social federation in Microsoft Entra External ID
        env:
          EXTERNAL_ID_CONFIG_CLIENT_ID: ${{ vars.EXTERNAL_ID_CONFIG_CLIENT_ID }}
        run: |
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          test "$(az account show --query id --output tsv)" = "$AZURE_SUBSCRIPTION_ID"
          social_configuration='config/authentication/external-id-social-providers.json'
          key_vault_name="$(
            jq -er --arg environment "$GAME_HUB_ENVIRONMENT" \
              '.credentialVault.nameTemplate | gsub("\\{environment\\}"; $environment)' \
              "$social_configuration"
          )"
          google_secret_name="$(
            jq -er \
              '.providers[] | select(.identityProviderType == "Google") | .clientSecretKeyVaultSecretName' \
              "$social_configuration"
          )"
          facebook_secret_name="$(
            jq -er \
              '.providers[] | select(.identityProviderType == "Facebook") | .clientSecretKeyVaultSecretName' \
              "$social_configuration"
          )"
          google_client_secret="$(
            az keyvault secret show \
              --vault-name "$key_vault_name" \
              --name "$google_secret_name" \
              --query value \
              --output tsv
          )"
          facebook_client_secret="$(
            az keyvault secret show \
              --vault-name "$key_vault_name" \
              --name "$facebook_secret_name" \
              --query value \
              --output tsv
          )"
          test -n "$google_client_secret"
          test -n "$facebook_client_secret"
          echo "::add-mask::$google_client_secret"
          echo "::add-mask::$facebook_client_secret"

          external_id_federated_token="$(
            curl --fail --silent --show-error \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange" |
              jq -er '.value'
          )"
          test -n "$external_id_federated_token"
          echo "::add-mask::$external_id_federated_token"
          az login \
            --service-principal \
            --username "$EXTERNAL_ID_CONFIG_CLIENT_ID" \
            --tenant "$GAME_HUB_EXTERNAL_ID_TENANT_ID" \
            --federated-token "$external_id_federated_token" \
            --allow-no-subscriptions \
            --output none
          unset external_id_federated_token
          test "$(
            az account get-access-token \
              --resource-type ms-graph \
              --query tenant \
              --output tsv
          )" = "$GAME_HUB_EXTERNAL_ID_TENANT_ID"
          GAME_HUB_GOOGLE_CLIENT_SECRET="$google_client_secret" \
            GAME_HUB_FACEBOOK_CLIENT_SECRET="$facebook_client_secret" \
            yarn auth:configure
          unset google_client_secret facebook_client_secret
